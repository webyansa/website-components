<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-label="الهيكل التنظيمي للجنة التنسيقية لجمعيات تحفيظ القرآن الكريم بالمملكة" font-family="'IBM Plex Sans Arabic','Tajawal','Segoe UI',sans-serif" direction="rtl">
  <defs>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1738"/>
      <stop offset="1" stop-color="#1249FF"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1249FF"/>
      <stop offset="1" stop-color="#38D9F2"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1249FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38D9F2" stop-opacity=".55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1738" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="880" fill="#F7FBFF"/>
  <g opacity=".5" stroke="#E2ECFA">
    <path d="M0 220H1200M0 440H1200M0 660H1200" />
  </g>

  <!-- المستوى 1 -->
  <g filter="url(#soft)">
    <rect x="420" y="46" width="360" height="86" rx="22" fill="url(#gNavy)"/>
  </g>
  <text x="600" y="79" fill="#8FD8FF" font-size="14" text-anchor="middle">السلطة العليا</text>
  <text x="600" y="108" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle">الجمعية العمومية</text>

  <path d="M600 132V186" stroke="url(#gLine)" stroke-width="2.5" fill="none"/>

  <!-- المستوى 2 -->
  <g filter="url(#soft)">
    <rect x="420" y="186" width="360" height="86" rx="22" fill="url(#gBlue)"/>
  </g>
  <text x="600" y="219" fill="#EAF6FF" font-size="14" text-anchor="middle">السلطة الإشرافية</text>
  <text x="600" y="248" fill="#FFFFFF" font-size="24" font-weight="700" text-anchor="middle">مجلس الإدارة</text>

  <!-- توزيع المستوى 3 -->
  <path d="M600 272V310M210 310H990M210 310V352M600 310V352M990 310V352" stroke="url(#gLine)" stroke-width="2.5" fill="none"/>

  <!-- المستوى 3: ثلاث وحدات -->
  <g>
    <rect x="70" y="352" width="280" height="92" rx="20" fill="#FFFFFF" stroke="#D8E6F8" stroke-width="1.5"/>
    <rect x="70" y="352" width="280" height="4" rx="2" fill="url(#gBlue)"/>
    <text x="210" y="392" fill="#5B7699" font-size="13" text-anchor="middle">إشراف فني</text>
    <text x="210" y="419" fill="#0A1738" font-size="20" font-weight="700" text-anchor="middle">اللجان الدائمة</text>
  </g>
  <g>
    <rect x="460" y="352" width="280" height="92" rx="20" fill="#FFFFFF" stroke="#D8E6F8" stroke-width="1.5"/>
    <rect x="460" y="352" width="280" height="4" rx="2" fill="url(#gBlue)"/>
    <text x="600" y="392" fill="#5B7699" font-size="13" text-anchor="middle">القيادة التنفيذية</text>
    <text x="600" y="419" fill="#0A1738" font-size="20" font-weight="700" text-anchor="middle">اللجنة التنفيذية</text>
  </g>
  <g>
    <rect x="850" y="352" width="280" height="92" rx="20" fill="#FFFFFF" stroke="#D8E6F8" stroke-width="1.5"/>
    <rect x="850" y="352" width="280" height="4" rx="2" fill="url(#gBlue)"/>
    <text x="990" y="392" fill="#5B7699" font-size="13" text-anchor="middle">الرقابة والالتزام</text>
    <text x="990" y="419" fill="#0A1738" font-size="20" font-weight="700" text-anchor="middle">المراجعة والحوكمة</text>
  </g>

  <path d="M600 444V500" stroke="url(#gLine)" stroke-width="2.5" fill="none"/>

  <!-- الأمانة العامة -->
  <g filter="url(#soft)">
    <rect x="430" y="500" width="340" height="82" rx="20" fill="#0A1738"/>
  </g>
  <text x="600" y="531" fill="#8FD8FF" font-size="13" text-anchor="middle">الإدارة التنفيذية</text>
  <text x="600" y="558" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">الأمانة العامة</text>

  <!-- توزيع الإدارات -->
  <path d="M600 582V624M165 624H1035M165 624V666M455 624V666M745 624V666M1035 624V666" stroke="url(#gLine)" stroke-width="2.5" fill="none"/>

  <g>
    <rect x="55" y="666" width="220" height="88" rx="18" fill="#EAF2FD" stroke="#D8E6F8"/>
    <text x="165" y="702" fill="#5B7699" font-size="12" text-anchor="middle">إدارة</text>
    <text x="165" y="728" fill="#0A1738" font-size="17" font-weight="700" text-anchor="middle">الشؤون المالية</text>
  </g>
  <g>
    <rect x="345" y="666" width="220" height="88" rx="18" fill="#EAF2FD" stroke="#D8E6F8"/>
    <text x="455" y="702" fill="#5B7699" font-size="12" text-anchor="middle">إدارة</text>
    <text x="455" y="728" fill="#0A1738" font-size="17" font-weight="700" text-anchor="middle">البرامج والمشاريع</text>
  </g>
  <g>
    <rect x="635" y="666" width="220" height="88" rx="18" fill="#EAF2FD" stroke="#D8E6F8"/>
    <text x="745" y="702" fill="#5B7699" font-size="12" text-anchor="middle">إدارة</text>
    <text x="745" y="728" fill="#0A1738" font-size="17" font-weight="700" text-anchor="middle">الخدمات المساندة</text>
  </g>
  <g>
    <rect x="925" y="666" width="220" height="88" rx="18" fill="#EAF2FD" stroke="#D8E6F8"/>
    <text x="1035" y="702" fill="#5B7699" font-size="12" text-anchor="middle">إدارة</text>
    <text x="1035" y="728" fill="#0A1738" font-size="17" font-weight="700" text-anchor="middle">التطوع والاتصال</text>
  </g>

  <path d="M600 754V794" stroke="url(#gLine)" stroke-width="2.5" fill="none"/>
  <g>
    <rect x="400" y="794" width="400" height="60" rx="30" fill="#FFFFFF" stroke="#D8E6F8" stroke-width="1.5"/>
    <text x="600" y="831" fill="#1249FF" font-size="17" font-weight="700" text-anchor="middle">الفرق الميدانية · المستوى التشغيلي</text>
  </g>
</svg>
